[project]
name = "openadmet-pxr"
version = "0.1.0"
description = "OpenADMET PXR Blind Challenge — Activity Prediction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chemprop>=2.2",
    "rdkit",
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "xgboost",
    "mlflow",
    "datasets",
    "huggingface-hub",
    "requests",
    "tqdm",
    "mordredcommunity",
    "mhfp",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "ipykernel",
    "matplotlib",
    "seaborn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openadmet_pxr"]
